name: Backend CI (Node + TypeScript + Jest)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
      - "prisma/**"
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 🧪 Run Backend Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: ${{ secrets.PORT }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST_NAME: ${{ secrets.DB_HOST_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      VERBOSE_AUTH_LOGS: ${{ secrets.VERBOSE_AUTH_LOGS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SECURE_COOKIE: ${{ secrets.SECURE_COOKIE }}

    defaults:
      run:
        working-directory: ./

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # ✅ Skip Prisma postinstall during CI (this prevents the error)
      - name: 🩵 Disable Prisma postinstall in CI
        run: npm pkg set scripts.postinstall="echo '⏭️ Skipping Prisma in CI'"

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # ✅ (Optional) Uncomment when ready for DB connection
      # - name: 🧩 Validate Prisma schema
      #   run: npx prisma validate
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # - name: 🧠 Generate Prisma client
      #   run: npx prisma generate
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🧮 Type check
        run: npx tsc --noEmit

      - name: 🧪 Run Jest tests
        run: npm test -- --coverage

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: coverage/
