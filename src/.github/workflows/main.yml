name: Backend CI (Node + TypeScript + Jest)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
      - "prisma/**"
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 🧪 Run Backend Tests
    runs-on: ubuntu-latest

    env:
      PORT: ${{ secrets.PORT }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}
      DB_HOST_NAME: ${{ secrets.DB_HOST_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      VERBOSE_AUTH_LOGS: ${{ secrets.VERBOSE_AUTH_LOGS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SECURE_COOKIE: ${{ secrets.SECURE_COOKIE }}

    defaults:
      run:
        working-directory: ./

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      # ✅ Prisma Schema Validation (always provide DATABASE_URL)
      - name: 🧩 Validate Prisma schema
        run: |
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL not found in secrets, using fallback URL"
            export DATABASE_URL="postgresql://postgres:YcKCtSVJPwfQARiPcxsxYuQewCAWEZiJ@switchyard.proxy.rlwy.net:51888/postgres"
          fi
          npx prisma validate

      # ✅ Generate Prisma Client
      - name: 🧠 Generate Prisma client
        run: |
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL not found in secrets, using fallback URL"
            export DATABASE_URL="postgresql://postgres:YcKCtSVJPwfQARiPcxsxYuQewCAWEZiJ@switchyard.proxy.rlwy.net:51888/postgres"
          fi
          npx prisma generate

      # ✅ TypeScript type-checking
      - name: 🧮 Type check
        run: npx tsc --noEmit

      # ✅ Run Jest tests
      - name: 🧪 Run Jest tests
        run: npm test -- --coverage

      # ✅ Upload test coverage artifacts
      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: coverage/
