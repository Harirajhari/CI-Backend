name: Backend CI (Node + TypeScript + Jest)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
      - "prisma/**"
  pull_request:
    branches: [ main, develop ]

jobs:
  # -----------------------------
  # 🧱 BUILD + TYPE CHECK JOB
  # -----------------------------
  build:
    name: 🧱 Build & Type Check
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: ${{ secrets.PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # ✅ Skip Prisma postinstall in CI
      - name: 🩵 Skip Prisma postinstall in CI
        run: npm pkg set scripts.postinstall="echo '⏭️ Skipping Prisma generate in CI'"

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧮 Type check
        run: npx tsc --noEmit

      - name: 📤 Upload workspace for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .
          retention-days: 1

  # -----------------------------
  # 🧪 JEST TEST JOB (separate)
  # -----------------------------
  test:
    name: 🧪 Run Jest Tests
    runs-on: ubuntu-latest
    needs: build  # ✅ wait for build job to complete first

    env:
      NODE_ENV: test
      PORT: ${{ secrets.PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Jest tests with coverage
        run: npm test -- --coverage

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: coverage/
