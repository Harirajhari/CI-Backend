name: Backend CI (Node + TypeScript + Tests)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 🧪 Run Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./        # root of your backend repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: coverage/
